// Replacement for android/settings.gradle (static review: original has no repositories,
// so AGP and all dependencies cannot resolve). Not executed here (no Android SDK).
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://storage.googleapis.com/download.flutter.io' }  // flutter_embedding_release
    }
}
rootProject.name = 'liveness-android-m4'
include ':liveness-android'
include ':bench-app'
include ':host-app'
