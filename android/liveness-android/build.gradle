// MOSIP Face Liveness + PAD - Android library module (M4).
// Not built by the Maven project. Requires AGP 8.x, Gradle 8.x, JDK 17 to run Gradle (sources stay Java 11).
plugins {
    id 'com.android.library'
}

// Flutter engine hash lookup (see the Flutter embedding comment in dependencies).
def flutterEngineHash = (findProperty('flutterEngineHash') ?: System.getenv('FLUTTER_ENGINE_HASH'))
if (!flutterEngineHash && System.getenv('FLUTTER_ROOT')) {
    def ev = new File(System.getenv('FLUTTER_ROOT'), 'bin/internal/engine.version')
    if (ev.isFile()) flutterEngineHash = ev.text.trim()
}
if (flutterEngineHash && !(flutterEngineHash ==~ /[0-9a-f]{40}/)) {
    throw new GradleException("flutterEngineHash must be 40 lowercase hex characters, got: '${flutterEngineHash}'")
}
tasks.register('requireFlutterEngineHash') {
    doFirst {
        if (!flutterEngineHash) {
            throw new GradleException('Flutter engine hash not set. Pass -PflutterEngineHash=<40-hex> or set FLUTTER_ENGINE_HASH ' +
                    'or FLUTTER_ROOT. Find it with `flutter --version -v` (Engine revision) or bin/internal/engine.version.')
        }
    }
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn 'requireFlutterEngineHash' }

android {
    namespace 'io.oxalpha.liveness'
    compileSdk 34

    defaultConfig {
        minSdk 28            // Android 9+
        targetSdk 31         // per brief; raise when the Registration Client does
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            // Reuse the shared engine (liveness.*) and the pure-Java android package from the Maven tree.
            java.srcDirs += ['../../src/main/java']
            // Desktop-only code stays out of the APK.
            java.exclude 'liveness/evaluation/**'
            java.exclude 'liveness/desktop/**'
        }
        test {
            java.srcDirs += ['../../src/test/java']
            java.exclude 'liveness/evaluation/**'
            java.exclude 'liveness/desktop/**'
            java.exclude 'liveness/engine/ModelQualificationTest.java'
        }
    }

    // The INT8 model is kept uncompressed so it can be memory-mapped.
    androidResources { noCompress 'onnx' }

    testOptions {
        unitTests.returnDefaultValues = true
        // ADR-010: stubs are test-only. The shared test tree uses stub scorers / stubbed same-face checks, so JVM
        // unit tests opt in explicitly. Never set this for release builds or instrumented/production runs.
        unitTests.all { systemProperty 'liveness.allowStubs', 'true' }
    }
}

dependencies {
    // ONNX Runtime for Android (AAR). Same ai.onnxruntime API the desktop MiniFasNetScorer uses.
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.16.3'

    // CameraX
    def camerax = '1.3.1'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"

    // AndroidX
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.7.0'

    // Flutter embedding (compileOnly: the host Flutter app provides it at runtime).
    // The 40-char engine hash must match the Flutter SDK that builds the host app. Supply it by any of:
    //   -PflutterEngineHash=<hash>   or   FLUTTER_ENGINE_HASH=<hash>   or   gradle.properties
    //   or FLUTTER_ROOT (reads $FLUTTER_ROOT/bin/internal/engine.version).
    // Find it with `flutter --version -v` ("Engine revision <hash>"). With no hash, Gradle fails fast
    // with instructions instead of trying to resolve a placeholder artifact.
    if (flutterEngineHash) {
        compileOnly "io.flutter:flutter_embedding_release:1.0.0-${flutterEngineHash}"
    }

    // Unit tests (JVM, no device)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.9.3'
}

tasks.withType(Test).configureEach { useJUnitPlatform() }

tasks.withType(Test).configureEach {
    workingDir = file('../..')
    systemProperty 'liveness.allowStubs', 'true'
}

dependencies {
    testImplementation 'com.microsoft.onnxruntime:onnxruntime:1.16.3'
}

configurations.configureEach {
    if (name.endsWith('UnitTestRuntimeClasspath')) {
        exclude group: 'com.microsoft.onnxruntime', module: 'onnxruntime-android'
    }
}
